# Static site — build settings stay empty in the Netlify UI (publish = repo root).

[build]
  publish = "."

[[headers]]
  for = "/Pictures/Horizontal/Web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Pictures/InvertedVertical/Web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Pictures/Resources/Web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
